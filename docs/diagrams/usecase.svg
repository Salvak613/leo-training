e="10" font-style="italic" font-weight="600" fill="#C44A1E">V1.1</text><ellipse cx="700" cy="2028" rx="128" ry="31" fill="#BDE3F5" stroke="#2F6F97" stroke-width="1.6"/><text x="700" y="2025" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#1F2937">Pointer un règlement</text><text x="700" y="2041" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#1F2937">encaissé sur place</text><text x="824" y="2001" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-style="italic" font-weight="600" fill="#C44A1E">V1.1</text><ellipse cx="1035" cy="224" rx="122" ry="31" fill="#BDE3F5" stroke="#2F6F97" stroke-width="1.6"/><text x="1035" y="229" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#1F2937">Envoyer un email</text><ellipse cx="1035" cy="1111" rx="122" ry="31" fill="#BDE3F5" stroke="#2F6F97" stroke-width="1.6"/><text x="1035" y="1116" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#1F2937">Téléverser une image</text><g stroke="#2F6F97" stroke-width="2" fill="none"><circle cx="170" cy="190" r="11" fill="#BDE3F5"/><line x1="170" y1="201" x2="170" y2="232"/><line x1="154" y1="212" x2="186" y2="212"/><line x1="170" y1="232" x2="156" y2="254"/><line x1="170" y1="232" x2="184" y2="254"/></g><text x="170" y="274" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#1F4E6E">Visiteur</text><g stroke="#2F6F97" stroke-width="2" fill="none"><circle cx="170" cy="493" r="11" fill="#BDE3F5"/><line x1="170" y1="504" x2="170" y2="535"/><line x1="154" y1="515" x2="186" y2="515"/><line x1="170" y1="535" x2="156" y2="557"/><line x1="170" y1="535" x2="184" y2="557"/></g><text x="170" y="577" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#1F4E6E">Admin</text><g stroke="#2F6F97" stroke-width="2" fill="none"><circl
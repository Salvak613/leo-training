80 2182 H 1182 l 18 18 V 2332 H 380 Z" fill="#FFF7D6" stroke="#C9A227" stroke-width="1.3"/><path d="M 1182 2182 v 18 h 18" fill="none" stroke="#C9A227" stroke-width="1.3"/><text x="396" y="2208" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#7A5A00">Contraintes sur les acteurs</text><text x="396" y="2232" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5B4A10">Organisateur : ses droits sont limités aux centres auxquels un admin l'a rattaché.</text><text x="396" y="2253" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5B4A10">Super Organisateur : mêmes cas d'utilisation, sans restriction de centre.</text><text x="396" y="2274" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5B4A10">Capitaine : rôle porté par une appartenance d'équipe, pas un compte distinct.</text><text x="396" y="2295" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5B4A10">Admin : compte dédié, distinct du compte joueur de la même personne, sans affiliation ni inscription.</text><text x="396" y="2316" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5B4A10">V1.1 : cas conçus et modélisés en Phase 1, livrés après le lot initial.</text></svg>